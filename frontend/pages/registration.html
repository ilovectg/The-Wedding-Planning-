<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Best Wedding Planning Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .register-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, var(--primary-color) 100%);
            padding: 40px 0;
        }
        .register-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-header h2 {
            color: var(--primary-color);
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group input {
            border-radius: 8px;
            border: 2px solid #eee;
            padding: 12px;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(216, 27, 96, 0.25);
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #ec407a 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.3);
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .password-strength {
            margin-top: 10px;
        }
        .password-strength .meter {
            height: 5px;
            background: #eee;
            border-radius: 5px;
            overflow: hidden;
        }
        .password-strength .meter-fill {
            height: 100%;
            width: 0%;
            background: #dc3545;
            transition: all 0.3s ease;
        }
        .terms {
            font-size: 0.9rem;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .terms input {
            margin-right: 10px;
        }
        .terms label {
            margin: 0;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="register-card">
                        <div class="register-header">
                            <i class="fas fa-ring text-danger" style="font-size: 2.5rem;"></i>
                            <h2 class="mt-3">Create Account</h2>
                            <p class="text-muted">Join our wedding planning community</p>
                        </div>

                        <form id="registrationForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="firstName">First Name</label>
                                        <input type="text" class="form-control" id="firstName" name="firstName" required 
                                               placeholder="Your first name">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="lastName">Last Name</label>
                                        <input type="text" class="form-control" id="lastName" name="lastName" required
                                               placeholder="Your last name">
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required 
                                       placeholder="your@email.com">
                            </div>

                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" name="phone" required
                                       placeholder="+880 1XXXXXXXXX">
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required
                                       placeholder="Enter a strong password">
                                <div class="password-strength">
                                    <div class="meter">
                                        <div class="meter-fill"></div>
                                    </div>
                                    <small id="strengthText" class="text-muted">Password strength: Weak</small>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                                       placeholder="Re-enter your password">
                            </div>

                            <div class="terms">
                                <input type="checkbox" id="terms" name="terms" required>
                                <label for="terms">
                                    I agree to the <a href="#" class="text-danger">Terms and Conditions</a> 
                                    and <a href="#" class="text-danger">Privacy Policy</a>
                                </label>
                            </div>

                            <button type="submit" class="btn btn-register">
                                <i class="fas fa-user-plus me-2"></i>Create Account
                            </button>
                        </form>

                        <div class="login-link">
                            <p class="text-muted">Already have an account? 
                                <a href="login.html">Login Here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]/)) strength += 25;
            if (password.match(/[A-Z]/)) strength += 25;
            if (password.match(/[0-9]/) || password.match(/[^a-zA-Z0-9]/)) strength += 25;
            
            const meter = document.querySelector('.meter-fill');
            const strengthText = document.getElementById('strengthText');
            
            meter.style.width = strength + '%';
            
            if (strength < 25) {
                meter.style.background = '#dc3545';
                strengthText.textContent = 'Password strength: Weak';
            } else if (strength < 50) {
                meter.style.background = '#fd7e14';
                strengthText.textContent = 'Password strength: Fair';
            } else if (strength < 75) {
                meter.style.background = '#ffc107';
                strengthText.textContent = 'Password strength: Good';
            } else {
                meter.style.background = '#28a745';
                strengthText.textContent = 'Password strength: Strong';
            }
        });

        // Form submission
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value.replace(/\s+/g, '');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!APP.validateEmail(email)) {
                APP.showToast('Please enter a valid email address', 'danger');
                return;
            }

            if (!APP.validatePhone(phone)) {
                APP.showToast('Please enter a valid Bangladeshi phone number', 'danger');
                return;
            }

            if (password.length < 8) {
                APP.showToast('Password must be at least 8 characters', 'danger');
                return;
            }

            if (password !== confirmPassword) {
                APP.showToast('Passwords do not match', 'danger');
                return;
            }

            try {
                await APP.makeApiRequest('/auth/register', 'POST', {
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    phone: phone,
                    password: password
                });

                APP.showToast('Registration successful! Please verify your email.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                APP.showToast(error.message || 'Registration failed. Please try again.', 'danger');
            }
        });
    </script>
</body>
</html>
