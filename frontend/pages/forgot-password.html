<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - The Best Wedding Planning Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div class="container py-5" style="max-width: 560px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h2 class="mb-2">Reset your password</h2>
            <p class="text-muted">Enter your email and we will send a reset link.</p>
            <form id="forgotForm">
                <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
                <button class="btn btn-danger w-100">Send Reset Link</button>
            </form>
            <div class="mt-3"><a href="login.html">Back to login</a></div>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await APP.makeApiRequest('/auth/forgot-password', 'POST', { email: document.getElementById('email').value });
                APP.showToast('Reset link sent if the account exists', 'success');
            } catch (error) {
                APP.showToast('Unable to send reset link', 'danger');
            }
        });
    </script>
</body>
</html>
