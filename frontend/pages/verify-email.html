<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - The Best Wedding Planning Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div class="container py-5" style="max-width: 560px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
            <h2 class="mb-2">Verify your email</h2>
            <p class="text-muted">We are checking your verification link now.</p>
            <div id="status" class="alert alert-info">Loading...</div>
            <a class="btn btn-danger" href="login.html">Go to login</a>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const statusBox = document.getElementById('status');

        async function verify() {
            if (!token) {
                statusBox.className = 'alert alert-danger';
                statusBox.textContent = 'Verification token is missing.';
                return;
            }

            try {
                const response = await APP.makeApiRequest(`/auth/verify-email/${token}`, 'GET');
                statusBox.className = 'alert alert-success';
                statusBox.textContent = response.message || 'Email verified successfully.';
            } catch (error) {
                statusBox.className = 'alert alert-danger';
                statusBox.textContent = 'Verification link is invalid or expired.';
            }
        }

        verify();
    </script>
</body>
</html>
