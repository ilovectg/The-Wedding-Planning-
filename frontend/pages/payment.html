<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments - The Best Wedding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white" href="../index.html">The Best Wedding</a>
      <div class="ms-auto">
        <a href="dashboard.html" class="btn btn-light btn-sm">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <h3>Payments</h3>
      <p class="text-muted">This page will let you manage payments and view invoices. For now it's a placeholder.</p>

      <div class="card p-4">
        <h6>Make a payment</h6>
        <form id="paymentForm" class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Amount (৳)</label>
            <input type="number" id="amount" class="form-control" placeholder="Enter amount" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Payment method</label>
            <select id="method" class="form-select">
              <option value="card">Card</option>
              <option value="bkash">bKash</option>
              <option value="bank">Bank Transfer</option>
            </select>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" id="payBtn">Pay now</button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('paymentForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const amount = Number(document.getElementById('amount').value) || 0;
      const method = document.getElementById('method').value;

      // disable inputs while processing
      const payBtn = document.getElementById('payBtn');
      payBtn.disabled = true;
      payBtn.textContent = 'Processing...';

      // Simulate payment processing delay
      setTimeout(() => {
        const txnId = 'TXN' + Date.now();

        // Show success modal with details
        document.getElementById('successAmount').textContent = amount.toLocaleString('en-US') + ' ৳';
        document.getElementById('successMethod').textContent = method;
        document.getElementById('successTxn').textContent = txnId;

        const modalEl = document.getElementById('paymentSuccessModal');
        const modal = new bootstrap.Modal(modalEl);
        modal.show();

        // After showing, reset form and button
        document.getElementById('paymentForm').reset();
        payBtn.disabled = false;
        payBtn.textContent = 'Pay now';

        // Optionally store a local receipt (demo)
        try {
          const receipts = JSON.parse(localStorage.getItem('payments') || '[]');
          receipts.unshift({ txnId, amount, method, date: new Date().toISOString() });
          localStorage.setItem('payments', JSON.stringify(receipts.slice(0,20)));
        } catch (err) { /* ignore storage errors */ }
      }, 900);
    });
  </script>

  <!-- Success Modal -->
  <div class="modal fade" id="paymentSuccessModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Payment Confirmed</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1">Thank you — your payment was successful.</p>
          <ul class="list-unstyled small">
            <li><strong>Amount:</strong> <span id="successAmount"></span></li>
            <li><strong>Method:</strong> <span id="successMethod"></span></li>
            <li><strong>Transaction ID:</strong> <span id="successTxn"></span></li>
          </ul>
          <p class="small text-muted">A receipt has been saved locally for demo purposes.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
