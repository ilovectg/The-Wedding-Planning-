<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation - The Best Wedding Planning Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div class="container py-5" style="max-width: 900px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <h1 class="h3">Booking Confirmation</h1>
                <p class="text-muted mb-0">Your booking has been submitted successfully.</p>
            </div>
            <div id="confirmationContent" class="bg-light rounded-4 p-4"></div>
            <div class="d-flex gap-2 mt-4">
                <a href="dashboard.html" class="btn btn-outline-secondary flex-grow-1">Go to Dashboard</a>
                <a href="booking.html" class="btn btn-danger flex-grow-1">Create Another Booking</a>
            </div>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script>
        const saved = APP.getData('bookingConfirmation') || APP.getData('budgetData');
        const target = document.getElementById('confirmationContent');
        const venueLabel = saved?.venue_label || (saved?.venue_name ? `${saved.venue_name}` : null);

        if (!saved) {
            target.innerHTML = '<p class="text-muted mb-0">No booking summary found. Return to the booking page.</p>';
        } else {
            target.innerHTML = `
                <p><strong>Booking ID:</strong> ${saved.booking_id || 'Pending'}</p>
                <p><strong>Name:</strong> ${saved.bride_name || ''} ${saved.groom_name ? '& ' + saved.groom_name : ''}</p>
                <p><strong>Email:</strong> ${saved.email || '-'}</p>
                <p><strong>Event Date:</strong> ${saved.event_date || '-'}</p>
                <p><strong>Guests:</strong> ${saved.guest_count || '-'}</p>
                <p><strong>Venue:</strong> ${venueLabel || 'No venue selected'}</p>
                <p><strong>Package:</strong> ${saved.package_id || saved.selectedPackage || '-'}</p>
                <p class="mb-0"><strong>Status:</strong> ${saved.confirmation_message || 'Pending review'}</p>
            `;
        }
    </script>
</body>
</html>
