<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details - The Best Wedding Planning Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body {
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f7f0f6;
            color: #241026;
        }

        .detail-shell {
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: linear-gradient(180deg, #2a102e 0%, #3c1a44 20%, #f7f0f6 20%, #f7f0f6 100%);
            position: relative;
            overflow: hidden;
        }

        .topbar {
            padding: 18px;
            color: #fff;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.12);
            color: #fff;
            text-decoration: none;
        }

        .page-card {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(42, 16, 46, 0.08);
            background: #fff;
        }

        .hero-card {
            background: linear-gradient(180deg, #f4dce9 0%, #f8edf3 100%);
        }

        .status-badge {
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-pending { background: #ffbf1f; color: #2b1b00; }
        .status-approved { background: #21a366; color: #fff; }
        .status-rejected { background: #e24d4d; color: #fff; }
        .status-completed { background: #5b4bdb; color: #fff; }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail-item {
            background: #faf6f9;
            border-radius: 14px;
            padding: 10px 12px;
        }

        .detail-label {
            font-size: 0.72rem;
            color: #866a86;
            margin-bottom: 4px;
        }

        .detail-value {
            font-weight: 600;
            color: #2a102e;
            word-break: break-word;
        }

        .venue-banner {
            height: 180px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(180deg, #c59cdb, #74418d);
            box-shadow: 0 14px 28px rgba(43,16,46,0.12);
        }

        .venue-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .venue-overlay {
            position: absolute;
            inset: auto 0 0 0;
            padding: 14px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(28,11,31,0.8) 100%);
            color: #fff;
        }

        .label-small {
            color: #7b6180;
            font-size: 0.78rem;
            margin-bottom: 3px;
        }

        .value-strong {
            color: #2a102e;
            font-weight: 600;
        }

        .img-thumb {
            width: 72px;
            height: 72px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 8px 18px rgba(42,16,46,0.12);
        }
    </style>
</head>
<body>
    <div class="detail-shell">
        <header class="topbar d-flex align-items-start justify-content-between">
            <div>
                <a href="dashboard.html" class="icon-btn mb-2"><i class="fas fa-arrow-left"></i></a>
                <div class="small opacity-75">Booking Details</div>
                <div class="h4 mb-0 fw-bold" id="detailTitle">Loading...</div>
            </div>
            <div>
                <button id="logoutBtn" class="icon-btn" title="Logout"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="px-3 pb-4">
            <section class="page-card hero-card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <div class="text-muted small">Booking ID</div>
                        <div class="h3 fw-bold mb-1" id="bookingIdLabel">#----</div>
                    </div>
                    <div id="statusBadgeHolder"></div>
                </div>
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">Event Date</div><div class="detail-value" id="eventDate">-</div></div>
                    <div class="detail-item"><div class="detail-label">Guests</div><div class="detail-value" id="guestCount">-</div></div>
                    <div class="detail-item"><div class="detail-label">Budget</div><div class="detail-value" id="budget">-</div></div>
                    <div class="detail-item"><div class="detail-label">Phone</div><div class="detail-value" id="phone">-</div></div>
                </div>
            </section>

            <section class="page-card p-3 mb-3">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <img id="venueImage" class="img-thumb" src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=500&q=80" alt="Venue">
                    <div>
                        <div class="label-small">Venue</div>
                        <div class="value-strong" id="venueName">Loading...</div>
                        <div class="text-muted small" id="venueLocation">-</div>
                    </div>
                </div>
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">Package</div><div class="detail-value" id="packageName">-</div></div>
                    <div class="detail-item"><div class="detail-label">Email</div><div class="detail-value" id="email">-</div></div>
                    <div class="detail-item"><div class="detail-label">Bride/Groom</div><div class="detail-value" id="brideName">-</div></div>
                    <div class="detail-item"><div class="detail-label">Partner</div><div class="detail-value" id="groomName">-</div></div>
                </div>
            </section>

            <section class="page-card p-3 mb-3">
                <div class="label-small">Notes</div>
                <div id="notes" class="value-strong fw-normal">Loading...</div>
            </section>

            <section class="page-card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="label-small">Quick Actions</div>
                        <div class="value-strong">View all bookings or confirm next steps</div>
                    </div>
                    <a href="booking.html" class="btn btn-sm btn-danger">New Booking</a>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const packageMap = {
            '1': 'Silver Package',
            '2': 'Gold Package',
            '3': 'Premium Package'
        };

        const venueImages = [
            'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80',
            'https://images.unsplash.com/photo-1505236858219-8359eb29e329?auto=format&fit=crop&w=1200&q=80',
            'https://images.unsplash.com/photo-1529636798458-92182e662485?auto=format&fit=crop&w=1200&q=80',
            'https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80'
        ];

        function getBookingIdFromQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('bookingId');
        }

        function requireAuth() {
            if (!localStorage.getItem('token')) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        function statusClass(status) {
            const value = String(status || 'Pending').toLowerCase();
            if (value === 'approved') return 'status-approved';
            if (value === 'rejected') return 'status-rejected';
            if (value === 'completed') return 'status-completed';
            return 'status-pending';
        }

        function formatDate(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return new Intl.DateTimeFormat('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }).format(date);
        }

        async function loadBookingDetails() {
            if (!requireAuth()) return;

            const bookingId = getBookingIdFromQuery();
            if (!bookingId) {
                document.getElementById('detailTitle').textContent = 'Booking not found';
                document.getElementById('notes').textContent = 'Missing booking id.';
                return;
            }

            try {
                const [booking, venues] = await Promise.all([
                    APP.makeApiRequest(`/bookings/${bookingId}`),
                    APP.makeApiRequest('/bookings/venues').catch(() => [])
                ]);

                const venue = (venues || []).find(v => String(v.venue_id) === String(booking.venue_id));
                const venueName = venue?.venue_name || `Venue #${booking.venue_id || '-'}`;
                const venueLocation = venue ? [venue.location, venue.city].filter(Boolean).join(', ') : `Venue ID: ${booking.venue_id || '-'}`;
                const venueImage = venue?.image_url || venueImages[(Number(booking.venue_id) || 1) % venueImages.length];
                const packageName = packageMap[String(booking.package_id)] || `Package #${booking.package_id || '-'}`;

                document.getElementById('detailTitle').textContent = booking.bride_name ? `${booking.bride_name}'s Booking` : 'Booking Details';
                document.getElementById('bookingIdLabel').textContent = `#${booking.booking_id}`;
                document.getElementById('statusBadgeHolder').innerHTML = `<span class="status-badge ${statusClass(booking.status)}">${booking.status || 'Pending'}</span>`;
                document.getElementById('eventDate').textContent = formatDate(booking.event_date);
                document.getElementById('guestCount').textContent = booking.guest_count || '-';
                document.getElementById('budget').textContent = booking.budget ? `৳${Number(booking.budget).toLocaleString()}` : '-';
                document.getElementById('phone').textContent = booking.phone || '-';
                document.getElementById('venueName').textContent = venueName;
                document.getElementById('venueLocation').textContent = venueLocation;
                document.getElementById('venueImage').src = venueImage;
                document.getElementById('packageName').textContent = packageName;
                document.getElementById('email').textContent = booking.email || '-';
                document.getElementById('brideName').textContent = booking.bride_name || '-';
                document.getElementById('groomName').textContent = booking.groom_name || '-';
                document.getElementById('notes').textContent = booking.notes || 'No notes added.';
            } catch (error) {
                document.getElementById('detailTitle').textContent = 'Unable to load booking';
                document.getElementById('notes').textContent = 'Please check the API server and try again.';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => APP.logout());
        loadBookingDetails();
    </script>
</body>
</html>
