<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Best Wedding Planning Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, var(--primary-color) 100%);
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: var(--primary-color);
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group input {
            border-radius: 8px;
            border: 2px solid #eee;
            padding: 12px;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(216, 27, 96, 0.25);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #ec407a 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.3);
        }
        .signup-link {
            text-align: center;
            margin-top: 20px;
        }
        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }
        .forgot-password a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .admin-login {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            text-align: center;
        }
        .admin-login a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="login-card">
                        <div class="login-header">
                            <i class="fas fa-ring text-danger" style="font-size: 2.5rem;"></i>
                            <h2 class="mt-3">Welcome Back!</h2>
                            <p class="text-muted">Login to your account</p>
                        </div>

                        <form id="loginForm">
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required 
                                       placeholder="your@email.com">
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required
                                       placeholder="Enter your password">
                            </div>

                            <div class="forgot-password">
                                <a href="forgot-password.html">Forgot Password?</a>
                            </div>

                            <button type="submit" class="btn btn-login">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                            <button type="button" id="demoLoginBtn" class="btn btn-outline-secondary mt-2 w-100">Use Demo Account</button>
                        </form>

                        <div class="signup-link">
                            <p class="text-muted">Don't have an account? 
                                <a href="registration.html">Sign Up Here</a>
                            </p>
                        </div>

                        <div class="admin-login">
                            <p class="text-muted mb-2">Are you an admin?</p>
                            <a href="admin-login.html">Login as Admin</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        function getLocalUsers() {
            return APP.getData('demoUsers') || [];
        }

        function findLocalUser(email, password) {
            const users = getLocalUsers();
            return users.find(user => user.email.toLowerCase() === email.toLowerCase() && user.password === password) || null;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await APP.makeApiRequest('/auth/login', 'POST', {
                    email: email,
                    password: password
                });

                if (response.token) {
                    APP.setData('token', response.token);
                    localStorage.setItem('token', response.token);
                    APP.setData('user', response.user);
                    APP.showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        APP.redirectAfterLogin(response.user);
                    }, 800);
                }
            } catch (error) {
                const demoUser = findLocalUser(email, password);

                if (demoUser) {
                    APP.setData('token', `demo-${demoUser.user_id}`);
                    localStorage.setItem('token', `demo-${demoUser.user_id}`);
                    APP.setData('user', {
                        user_id: demoUser.user_id,
                        first_name: demoUser.first_name,
                        last_name: demoUser.last_name,
                        email: demoUser.email,
                        role: demoUser.role || 'user'
                    });

                    APP.showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => { APP.redirectAfterLogin({ role: 'user' }); }, 800);
                    return;
                }

                APP.showToast('Invalid email or password', 'danger');
            }
        });

        // Demo login helper
        document.getElementById('demoLoginBtn').addEventListener('click', function() {
            try {
                const demo = APP.registerDemoUser({
                    first_name: 'Demo',
                    last_name: 'User',
                    email: 'demo@local',
                    password: 'demo',
                    role: 'user'
                });

                APP.setData('token', `demo-${demo.user_id}`);
                localStorage.setItem('token', `demo-${demo.user_id}`);
                APP.setData('user', {
                    user_id: demo.user_id,
                    first_name: demo.first_name,
                    last_name: demo.last_name,
                    email: demo.email,
                    role: demo.role
                });

                APP.showToast('Logged in as demo user', 'success');
                setTimeout(() => { APP.redirectAfterLogin({ role: demo.role }); }, 800);
            } catch (err) {
                // If user exists, just login
                const existing = APP.loginDemoUser('demo@local', 'demo');
                if (existing) {
                    APP.setData('token', `demo-${existing.user_id}`);
                    localStorage.setItem('token', `demo-${existing.user_id}`);
                    APP.setData('user', existing);
                    APP.showToast('Logged in as demo user', 'success');
                    setTimeout(() => { APP.redirectAfterLogin(existing); }, 800);
                } else {
                    APP.showToast('Unable to create demo user', 'danger');
                }
            }
        });
    </script>
</body>
</html>
