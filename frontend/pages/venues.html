<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venues - The Best Wedding Planning Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body {
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f7f0f6;
            color: #241026;
        }

        .venues-shell {
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: linear-gradient(180deg, #2a102e 0%, #3c1a44 20%, #f7f0f6 20%, #f7f0f6 100%);
            position: relative;
            overflow: hidden;
        }

        .topbar {
            padding: 18px;
            color: #fff;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.12);
            color: #fff;
            text-decoration: none;
        }

        .search-pill {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            backdrop-filter: blur(8px);
        }

        .search-pill input {
            width: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            font-size: 0.95rem;
        }

        .search-pill input::placeholder { color: rgba(255,255,255,0.68); }
        .search-pill i { color: rgba(255,255,255,0.78); }

        .content {
            padding: 16px 14px 90px;
        }

        .section-card {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(42,16,46,0.08);
            background: #fff;
        }

        .hero-card {
            background: linear-gradient(135deg, #f3dcea 0%, #f9f2f6 100%);
            color: #2a102e;
        }

        .hero-card .subtle {
            color: #6f5771;
            font-size: 0.92rem;
        }

        .district-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .district-chip {
            border: 0;
            border-radius: 999px;
            padding: 10px 14px;
            white-space: nowrap;
            flex: 0 0 auto;
            background: #fff;
            color: #5b4260;
            box-shadow: 0 8px 18px rgba(42,16,46,0.06);
            font-size: 0.9rem;
        }

        .district-chip.active {
            background: #6b2f86;
            color: #fff;
        }

        .venue-card {
            border: 0;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(43,16,46,0.08);
            background: #fff;
        }

        .venue-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .venue-card .body {
            padding: 14px;
        }

        .venue-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2a102e;
        }

        .venue-location {
            color: #7b6180;
            font-size: 0.9rem;
        }

        .venue-price {
            color: #b14f8f;
            font-weight: 700;
        }

        .venue-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 12px;
        }

        .venue-desc {
            color: #6f5771;
            font-size: 0.88rem;
            margin-top: 8px;
            line-height: 1.5;
        }

        .venue-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #faf6f9;
            color: #6a4a69;
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .filter-pill {
            border: 0;
            background: #fff;
            color: #5b4260;
            border-radius: 999px;
            padding: 9px 14px;
            box-shadow: 0 8px 18px rgba(42,16,46,0.06);
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .filter-pill.active {
            background: #6b2f86;
            color: #fff;
        }

        .result-count {
            color: #6f5771;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <div class="venues-shell">
        <header class="topbar">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <a href="dashboard.html" class="icon-btn mb-2"><i class="fas fa-arrow-left"></i></a>
                    <div class="small opacity-75">Explore Venues</div>
                    <div class="h4 mb-0 fw-bold">Choose your perfect venue</div>
                </div>
                <a href="booking.html" class="icon-btn"><i class="fas fa-calendar-plus"></i></a>
            </div>
            <div class="search-pill">
                <i class="fas fa-search"></i>
                <input id="venueSearch" placeholder="Search venues, city, price..." />
            </div>
        </header>

        <main class="content">
            <section class="section-card hero-card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div>
                        <div class="small text-uppercase fw-semibold">District Discovery</div>
                        <h5 class="mb-1 fw-bold">Find venues by district</h5>
                        <div class="subtle">Search faster, compare better, and pick the right wedding location for your area.</div>
                    </div>
                    <a href="booking.html" class="btn btn-sm btn-danger">Book Now</a>
                </div>
            </section>

            <section class="section-card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="fw-semibold">Suggested districts</div>
                    <div id="resultCount" class="result-count">0 venues</div>
                </div>
                <div class="district-row" id="filterRow"></div>
            </section>

            <section id="venueList" class="d-grid gap-3"></section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const fallbackImages = [
            'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80',
            'https://images.unsplash.com/photo-1505236858219-8359eb29e329?auto=format&fit=crop&w=1200&q=80',
            'https://images.unsplash.com/photo-1529636798458-92182e662485?auto=format&fit=crop&w=1200&q=80',
            'https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80'
        ];

        let allVenues = [];
        let activeFilter = 'all';
        let searchDebounce = null;

        function requireAuth() {
            if (!localStorage.getItem('token')) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        function normalize(text) {
            return String(text || '').toLowerCase();
        }

        function getDistrict(venue) {
            return (venue.city || venue.location || 'Unknown').trim();
        }

        function buildDistrictFilters() {
            const row = document.getElementById('filterRow');
            if (!row) return;

            const counts = allVenues.reduce((acc, venue) => {
                const district = getDistrict(venue);
                acc[district] = (acc[district] || 0) + 1;
                return acc;
            }, {});

            const districts = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6)
                .map(([district, count]) => ({ district, count }));

            const chipMarkup = [
                `<button class="district-chip ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">All districts</button>`,
                ...districts.map(({ district, count }) => {
                    const active = normalize(activeFilter) === normalize(district);
                    return `<button class="district-chip ${active ? 'active' : ''}" data-filter="${district}">${district} <span class="opacity-75">(${count})</span></button>`;
                })
            ].join('');

            row.innerHTML = chipMarkup;
        }

        function renderVenues() {
            const container = document.getElementById('venueList');
            const query = normalize(document.getElementById('venueSearch').value);

            const filtered = allVenues.filter((venue) => {
                const matchesSearch = !query || [venue.venue_name, venue.location, venue.city, venue.price_per_day]
                    .some((value) => normalize(value).includes(query));
                const district = getDistrict(venue);
                const matchesFilter = activeFilter === 'all' || normalize(district) === normalize(activeFilter);
                return matchesSearch && matchesFilter;
            });

            const resultCount = document.getElementById('resultCount');
            if (resultCount) {
                resultCount.textContent = `${filtered.length} venue${filtered.length === 1 ? '' : 's'}`;
            }

            if (!filtered.length) {
                container.innerHTML = '<div class="section-card p-4 text-center text-muted">No venues found.</div>';
                return;
            }

            container.innerHTML = filtered.map((venue, index) => {
                const image = venue.image_url || fallbackImages[index % fallbackImages.length];
                const name = venue.venue_name || 'Wedding Venue';
                const district = getDistrict(venue);
                const location = [venue.location, venue.city].filter(Boolean).join(', ') || '-';
                const price = Number(venue.price_per_day || 0).toLocaleString();
                const capacity = venue.capacity ? `${venue.capacity} guests` : 'Capacity not set';
                const rating = venue.rating ? `${venue.rating}/5` : 'New';
                const description = venue.description || `Popular wedding venue in ${district}. Elegant setting, premium service, and easy booking.`;

                return `
                    <article class="venue-card">
                        <img src="${image}" alt="${name}">
                        <div class="body">
                            <div class="d-flex justify-content-between align-items-start gap-2">
                                <div>
                                    <div class="venue-title">${name}</div>
                                    <div class="venue-location">${location}</div>
                                </div>
                                <div class="venue-price">৳${price}</div>
                            </div>
                            <div class="venue-desc">${description}</div>
                            <div class="venue-meta">
                                <span class="venue-chip"><i class="fas fa-users"></i>${capacity}</span>
                                <span class="venue-chip"><i class="fas fa-star"></i>${rating}</span>
                            </div>
                            <div class="mt-3 d-flex justify-content-between align-items-center">
                                <div class="small text-muted">Available venue</div>
                                <a class="btn btn-sm btn-danger" href="booking.html?venueId=${venue.venue_id}">Book Now</a>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        async function loadVenues() {
            if (!requireAuth()) return;
            try {
                allVenues = await APP.makeApiRequest('/bookings/venues');
                buildDistrictFilters();
                renderVenues();
            } catch (error) {
                document.getElementById('venueList').innerHTML = '<div class="section-card p-4 text-danger">Unable to load venues.</div>';
            }
        }

        document.getElementById('venueSearch').addEventListener('input', () => {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(renderVenues, 180);
        });

        document.getElementById('filterRow').addEventListener('click', (event) => {
            const button = event.target.closest('[data-filter]');
            if (!button) return;
            activeFilter = button.dataset.filter;
            document.querySelectorAll('.district-chip').forEach((pill) => pill.classList.remove('active'));
            button.classList.add('active');
            renderVenues();
        });

        loadVenues();
    </script>
</body>
</html>
