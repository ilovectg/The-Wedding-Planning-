<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - The Best Wedding Planning Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div class="container py-5" style="max-width: 560px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h2 class="mb-2">Create a new password</h2>
            <p class="text-muted">Use the token from your email reset link.</p>
            <form id="resetForm">
                <div class="mb-3"><label class="form-label">New Password</label><input type="password" class="form-control" id="password" required></div>
                <div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" class="form-control" id="confirmPassword" required></div>
                <button class="btn btn-danger w-100">Update Password</button>
            </form>
            <div class="mt-3"><a href="login.html">Back to login</a></div>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            APP.showToast('Reset token is missing', 'danger');
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                APP.showToast('Passwords do not match', 'danger');
                return;
            }

            try {
                await APP.makeApiRequest(`/auth/reset-password/${token}`, 'POST', { newPassword: password });
                APP.showToast('Password updated successfully', 'success');
                setTimeout(() => window.location.href = 'login.html', 1200);
            } catch (error) {
                APP.showToast('Unable to reset password', 'danger');
            }
        });
    </script>
</body>
</html>
