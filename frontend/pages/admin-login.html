<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - The Best Wedding Planning Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .auth-shell { min-height: 100vh; display: flex; align-items: center; background: linear-gradient(135deg, #1f2937 0%, var(--primary-color) 100%); }
        .auth-card { background: white; border-radius: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.18); padding: 40px; }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="auth-card">
                        <div class="text-center mb-4">
                            <i class="fas fa-shield-halved text-danger" style="font-size: 2.5rem;"></i>
                            <h2 class="mt-3 mb-1">Admin Login</h2>
                            <p class="text-muted mb-0">Access the management dashboard</p>
                        </div>
                        <form id="adminLoginForm">
                            <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
                            <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="password" required></div>
                            <button type="submit" class="btn btn-danger w-100">Login as Admin</button>
                        </form>
                        <div class="text-center mt-3"><a href="login.html">Back to user login</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const response = await APP.makeApiRequest('/auth/login', 'POST', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });

                if (response.user.role !== 'admin') {
                    APP.showToast('Admin access required', 'danger');
                    return;
                }

                APP.setData('token', response.token);
                APP.setData('user', response.user);
                APP.showToast('Admin login successful', 'success');
                setTimeout(() => APP.redirectAfterLogin(response.user), 1200);
            } catch (error) {
                APP.showToast('Unable to sign in as admin', 'danger');
            }
        });
    </script>
</body>
</html>
